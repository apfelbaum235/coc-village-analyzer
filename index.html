<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>CoC Village Analyzer</title><link rel="stylesheet" href="style.css"></head><body><header class="hero"><div class="brand">🏰 <div><strong>CoC Village Analyzer</strong><small>JSON Village Inspector</small></div></div><button class="ghost" id="sampleBtn">Beispieldorf</button></header><main><section id="uploadView" class="upload-view"><div class="upload-card" id="drop"><div class="upload-icon">📦</div><h1>Dein Dorf analysieren</h1><p>Ziehe deinen Clash-of-Clans-JSON-Export hierher oder wähle eine Datei aus.</p><label class="primary"><input id="file" type="file" accept=".json,application/json">JSON auswählen</label><div class="privacy">🔒 Die JSON wird ausschließlich lokal verarbeitet.</div></div></section><section id="dashboard" class="hidden"><div class="dashboard-head"><div><div class="eyebrow">VILLAGE</div><h1>Dorfanalyse</h1><code id="playerTag"></code></div><div class="actions"><button class="secondary" id="newBtn">Neues JSON</button><button class="primary" id="exportBtn">JSON exportieren</button></div></div><div class="stat-grid" id="stats"></div><div class="layout"><aside class="sidebar card"><h3>Kategorien</h3><div id="categories"></div><div class="side-note">Unbekannte Data-IDs bleiben sichtbar.</div></aside><section class="card content"><div class="toolbar"><input id="search" placeholder="🔎 Objekt, Data-ID oder Level suchen …"><select id="sort"><option value="data">Data-ID</option><option value="name">Name</option><option value="level">Level</option><option value="count">Anzahl</option></select></div><div id="categoryTitle" class="category-title"></div><div class="table-scroll"><table><thead><tr><th>Objekt</th><th>Data-ID</th><th>Level</th><th>Anzahl</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section></div><section class="card raw-card"><butt
